<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Carrera · Tu talento tiene muchos caminos</title>
<meta name="description" content="Conoce los cargos que existen, mira qué necesitas para llegar a ellos y postúlate.">
<meta name="theme-color" content="#1F1F1F">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

const CONFIG = {
  // 1) Pega la misma configuración de Firebase del artefacto administrativo (☁ Nube).
  firebase: {
    // apiKey: "...",
    // authDomain: "cartografia-talento.firebaseapp.com",
    // projectId: "cartografia-talento",
    // storageBucket: "...",
    // messagingSenderId: "...",
    // appId: "..."
  },
  // 2) El mismo código de organización que usas en el artefacto.
  orgCode: "",
  // 3) Marca.
  nombreOrg: "AVSA",
  titulo: "Plan Carrera",
  bajada: "",
  lema: ""
};

// 4) Imágenes. Deja vacío lo que no tengas: se dibuja un fondo con el ícono del área.
//    Puedes usar rutas relativas ("img/granjas.jpg") o direcciones completas.
const IMAGENES = {
  logo: "",          // logo de la organización para la barra superior
  hero: "",          // foto grande de la portada
  areas: {
    // La clave debe ser el nombre del área tal como aparece en el artefacto:
    // "Granjas": "img/granjas.jpg",
    // "Plantas": "img/plantas.jpg",
  }
};

// 5) Preguntas frecuentes. Ajusta las respuestas a la política real de la organización.
const PREGUNTAS = [
  { p: "¿Quién se puede postular?",
    r: "Cualquier persona vinculada a la organización que quiera moverse a otro cargo. No importa el área en la que estés hoy: los caminos se pueden cruzar." },
  { p: "¿Puedo postularme si no cumplo todos los requisitos?",
    r: "Sí. La autoevaluación no es un filtro que te deje por fuera, es una foto de dónde estás. Postularte nos deja saber que ese camino te interesa, y así podemos acompañarte en lo que te falta." },
  { p: "¿Qué pasa después de que envío mi postulación?",
    r: "Gestión Humana revisa tu caso y te contacta al celular que registraste. Guarda el código que aparece al final para preguntar por tu proceso." },
  { p: "¿Cuánto se demora?",
    r: "Depende de si hay una vacante abierta en ese momento. Aunque no la haya, tu postulación queda registrada para cuando se abra." },
  { p: "¿Mi jefe se entera de que me postulé?",
    r: "El proceso lo lleva Gestión Humana. En algún momento se habla con tu líder, porque tu experiencia en el cargo actual es parte de la evaluación." },
  { p: "¿Me puedo postular a varios cargos?",
    r: "Sí. Puedes recorrer las áreas y postularte a los cargos que te interesen." }
];
</script>

<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --negro:#1F1F1F;
    --negro-suave:#2A2A2A;
    --dorado:#C8A24A;
    --dorado-hondo:#A8843C;
    --crema:#F7F1E3;
    --blanco:#FFFFFF;
    --gris-claro:#F5F5F5;
    --gris-medio:#D9D9D9;
    --gris-oscuro:#666666;
    --verde:#3F7A57;
    --terracota:#A64A3E;
    --ancho:1280px;
    --lectura:720px;
    --r:14px;
  }
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--blanco);color:var(--negro);
    font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  .contenido{max-width:var(--ancho);margin:0 auto;padding:0 22px;}

  /* ================= BARRA SUPERIOR ================= */
  .cabecera{background:var(--negro);color:var(--blanco);position:sticky;top:0;z-index:60;}
  .cabecera-fila{max-width:var(--ancho);margin:0 auto;padding:0 22px;
    display:flex;align-items:center;gap:18px;min-height:70px;}
  .marca{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;
    padding:0;color:inherit;font-family:inherit;text-align:left;}
  .marca-logo{height:38px;width:auto;}
  .marca-nom{font-size:23px;font-weight:800;letter-spacing:.06em;}
  .marca-div{width:1px;height:38px;background:rgba(255,255,255,.28);}
  .marca-tit{display:block;font-size:16px;font-weight:700;line-height:1.2;}
  .marca-sub{display:block;font-size:12.5px;color:#B9B3A6;line-height:1.2;}

  .menu{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .menu button{background:none;border:0;color:#E6E2D9;font-family:inherit;font-size:15px;
    font-weight:500;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;
    border-radius:4px 4px 0 0;}
  .menu button:hover{color:var(--blanco);}
  .menu button.activo{color:var(--blanco);font-weight:700;border-bottom-color:var(--dorado);}
  .menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);
    color:var(--blanco);border-radius:9px;padding:9px 12px;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:600;}

  /* ================= PORTADA ================= */
  .portada{background:var(--negro);color:var(--blanco);overflow:hidden;}
  .portada-rejilla{max-width:var(--ancho);margin:0 auto;display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;}
  .portada-txt{padding:52px 22px 44px;display:flex;flex-direction:column;justify-content:center;}
  .portada h1{font-size:clamp(34px,4.4vw,56px);line-height:1.03;font-weight:800;
    letter-spacing:-.025em;margin:0 0 18px;}
  .portada h1 span{display:block;color:var(--dorado);}
  .portada-lead{margin:0;font-size:18px;line-height:1.5;color:#DCD7CC;max-width:34ch;}
  .portada-regla{width:74px;height:4px;background:var(--dorado);border-radius:2px;margin:26px 0 30px;}
  .ventajas{display:flex;flex-wrap:wrap;}
  .ventaja{display:flex;align-items:center;gap:12px;padding-right:22px;margin-right:22px;
    border-right:1px solid rgba(255,255,255,.2);}
  .ventaja:last-child{border-right:0;margin-right:0;padding-right:0;}
  .ventaja-ico{width:46px;height:46px;border-radius:50%;border:2px solid var(--dorado);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .ventaja span{font-size:14.5px;line-height:1.3;max-width:15ch;}

  .portada-media{position:relative;min-height:340px;background:var(--negro-suave);
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;}
  .portada-media::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,var(--negro) 0%,rgba(31,31,31,.55) 22%,rgba(31,31,31,0) 55%);}
  .tarjeta-lema{position:absolute;z-index:2;top:36px;right:32px;max-width:290px;
    background:var(--crema);color:var(--negro);border-radius:16px;padding:22px 24px;}
  .tarjeta-lema b{display:block;font-size:18px;font-weight:800;line-height:1.3;}
  .tarjeta-lema hr{border:0;height:3px;width:54px;background:var(--dorado);margin:14px 0;border-radius:2px;}
  .tarjeta-lema p{margin:0;font-size:16px;line-height:1.45;}

  /* ================= SECCIONES ================= */
  .seccion{padding:46px 0 40px;}
  .ficha{max-width:var(--lectura);}
  .seccion-cab{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px;}
  .seccion-cab h2{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
  .seccion-cab p{margin:0;color:var(--gris-oscuro);font-size:16px;}
  .titulo-pag{font-size:clamp(25px,3vw,30px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
  .lead-pag{margin:0 0 22px;color:var(--gris-oscuro);}
  .buscador{margin-left:auto;position:relative;min-width:280px;flex:0 1 340px;}
  .buscador input{width:100%;font-family:inherit;font-size:15.5px;padding:13px 16px 13px 44px;
    border:1px solid var(--gris-medio);border-radius:99px;background:var(--blanco);color:var(--negro);}
  .buscador input:focus{outline:none;border-color:var(--dorado);box-shadow:0 0 0 3px rgba(200,162,74,.2);}
  .buscador svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);}

  /* Tarjetas de área */
  .rejilla-areas{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));}
  .area{background:var(--blanco);border:1px solid var(--gris-medio);border-radius:var(--r);
    overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;color:inherit;padding:0;
    display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s,transform .18s;}
  .area:hover{border-color:var(--dorado);box-shadow:0 8px 24px rgba(31,31,31,.09);transform:translateY(-2px);}
  .area-foto{position:relative;aspect-ratio:16/10;background:var(--crema);
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;}
  .area-foto.sin-foto{background:linear-gradient(140deg,#EFE7D5,#DCCFB2);}
  .area-ico{position:absolute;left:14px;bottom:-19px;width:38px;height:38px;border-radius:50%;
    background:var(--dorado);display:flex;align-items:center;justify-content:center;
    border:3px solid var(--blanco);}
  .area-pie{padding:26px 16px 16px;display:flex;align-items:center;gap:10px;}
  .area-pie > div{flex:1;min-width:0;}
  .area-nom{font-size:16.5px;font-weight:700;line-height:1.25;}
  .area-cuenta{font-size:13.5px;color:var(--gris-oscuro);}

  /* Franja de beneficios */
  .franja{background:var(--crema);padding:30px 0;}
  .franja-fila{max-width:var(--ancho);margin:0 auto;padding:0 22px;display:flex;
    align-items:center;flex-wrap:wrap;}
  .franja-item{display:flex;align-items:center;gap:13px;padding-right:30px;margin-right:30px;
    border-right:1px solid rgba(31,31,31,.14);}
  .franja-item b{display:block;font-size:16px;font-weight:700;line-height:1.2;}
  .franja-item span{font-size:14px;color:var(--gris-oscuro);}
  .franja-lema{margin-left:auto;font-family:'Caveat',cursive;font-size:34px;line-height:1;
    text-align:center;padding-left:20px;}
  .franja-lema u{display:block;height:3px;width:120px;background:var(--dorado);
    margin:8px auto 0;border-radius:2px;}

  /* ================= EL CAMINO ================= */
  .volver{background:none;border:0;font-family:inherit;font-size:15px;font-weight:600;
    color:var(--dorado-hondo);cursor:pointer;padding:0;margin-bottom:18px;}
  .volver:hover{color:var(--negro);}
  .ruta{list-style:none;margin:0;padding:0;position:relative;max-width:760px;}
  .ruta::before{content:"";position:absolute;left:23px;top:16px;bottom:28px;width:3px;
    background:linear-gradient(var(--dorado),var(--crema));border-radius:2px;
    transform-origin:top;animation:crecer .7s ease-out both;}
  @keyframes crecer{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .peldano{position:relative;padding-left:66px;margin-bottom:14px;}
  .marca-nivel{position:absolute;left:0;top:14px;width:48px;height:48px;border-radius:50%;
    background:var(--blanco);border:3px solid var(--dorado);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:18px;}
  .peldano-btn{display:block;width:100%;text-align:left;background:var(--blanco);
    border:1px solid var(--gris-medio);border-radius:var(--r);padding:17px 20px;cursor:pointer;
    font-family:inherit;color:inherit;transition:border-color .16s,box-shadow .16s;}
  .peldano-btn:hover{border-color:var(--dorado);box-shadow:0 4px 16px rgba(200,162,74,.16);}
  .peldano-nom{font-size:18.5px;font-weight:700;line-height:1.25;margin-bottom:4px;}
  .peldano-area{font-size:14.5px;color:var(--dorado-hondo);font-weight:600;margin-bottom:4px;}
  .peldano-txt{font-size:15px;color:var(--gris-oscuro);line-height:1.45;}
  .peldano-ver{font-size:14.5px;font-weight:700;color:var(--dorado-hondo);margin-top:9px;}

  /* ================= FICHA DEL CARGO ================= */
  .chip{display:inline-block;background:var(--crema);border:1px solid var(--dorado);
    color:var(--dorado-hondo);font-size:13px;font-weight:700;padding:4px 13px;border-radius:99px;}
  .cargo-tit{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.06;
    letter-spacing:-.025em;margin:14px 0 16px;}
  .consiste{background:var(--crema);border-radius:var(--r);padding:22px 24px;font-size:17.5px;
    line-height:1.6;margin-bottom:32px;}
  .consiste.vacio{background:var(--gris-claro);color:var(--gris-oscuro);font-size:16px;}
  .grupo{margin-bottom:28px;}
  .grupo h3{font-size:18px;font-weight:700;margin:0 0 4px;}
  .grupo-nota{font-size:14px;color:var(--gris-oscuro);margin:0 0 12px;}
  .lista{list-style:none;margin:0;padding:0;}
  .lista li{position:relative;padding:9px 0 9px 27px;font-size:16.5px;line-height:1.45;
    border-bottom:1px solid var(--gris-claro);}
  .lista li::before{content:"";position:absolute;left:4px;top:17px;width:8px;height:8px;
    border-radius:50%;background:var(--dorado);}
  .lista li:last-child{border-bottom:none;}

  /* ================= AUTOEVALUACIÓN ================= */
  .opcion{display:flex;gap:14px;align-items:flex-start;padding:14px 17px;margin-bottom:10px;
    border:1px solid var(--gris-medio);border-radius:12px;cursor:pointer;background:var(--blanco);
    transition:border-color .15s,background .15s;min-height:58px;}
  .opcion:hover{border-color:var(--dorado);}
  .opcion input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;
    border:2px solid var(--gris-medio);border-radius:7px;cursor:pointer;background:var(--blanco);
    position:relative;transition:background .15s,border-color .15s;}
  .opcion input:checked{background:var(--verde);border-color:var(--verde);}
  .opcion input:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
    border:solid var(--blanco);border-width:0 3px 3px 0;transform:rotate(42deg);}
  .opcion:has(input:checked){background:#F2F7F3;border-color:var(--verde);}
  .opcion span{font-size:16.5px;line-height:1.4;}
  .grupo-eval{font-size:15.5px;font-weight:700;margin:26px 0 11px;padding-bottom:7px;
    border-bottom:2px solid var(--gris-medio);}

  /* ================= RESULTADO ================= */
  .veredicto{border-radius:var(--r);padding:26px;margin-bottom:24px;}
  .veredicto.alto{background:#F2F7F3;border:1px solid var(--verde);}
  .veredicto.medio{background:var(--crema);border:1px solid var(--dorado);}
  .veredicto.bajo{background:var(--gris-claro);border:1px solid var(--gris-medio);}
  .veredicto h2{font-size:25px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;}
  .veredicto p{margin:0;font-size:16.5px;line-height:1.55;}
  .barra-ajuste{height:12px;background:var(--gris-medio);border-radius:99px;overflow:hidden;margin:18px 0 8px;}
  .barra-ajuste i{display:block;height:100%;border-radius:99px;background:var(--dorado);transition:width .5s ease-out;}
  .veredicto.alto .barra-ajuste i{background:var(--verde);}
  .ajuste-txt{font-size:14.5px;color:var(--gris-oscuro);}
  .bloque{border:1px solid var(--gris-medio);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;}
  .bloque h3{font-size:18px;font-weight:700;margin:0 0 10px;}
  .marcada{list-style:none;margin:0;padding:0;}
  .marcada li{position:relative;padding:7px 0 7px 29px;font-size:16px;line-height:1.45;}
  .marcada.si li::before{content:"✓";position:absolute;left:2px;top:7px;color:var(--verde);font-weight:800;}
  .marcada.no li::before{content:"•";position:absolute;left:5px;top:4px;color:var(--terracota);
    font-weight:800;font-size:21px;line-height:1;}
  .prepararse{background:var(--crema);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;}
  .prepararse h3{font-size:18px;font-weight:700;margin:0 0 6px;}
  .prepararse p{margin:0 0 10px;font-size:15px;color:var(--gris-oscuro);}

  /* ================= FORMULARIO ================= */
  .rejilla-campos{display:grid;gap:0 20px;grid-template-columns:1fr 1fr;}
  .campo{margin-bottom:17px;}
  .campo.ancho{grid-column:1/-1;}
  .campo label{display:block;font-size:15px;font-weight:600;margin-bottom:6px;}
  .campo .ayuda{font-weight:400;color:var(--gris-oscuro);font-size:13.5px;}
  .campo input,.campo textarea{width:100%;font-family:inherit;font-size:16.5px;color:var(--negro);
    padding:13px 15px;border:1px solid var(--gris-medio);border-radius:11px;background:var(--blanco);}
  .campo textarea{min-height:104px;resize:vertical;}
  .campo input:focus,.campo textarea:focus{outline:none;border-color:var(--dorado);
    box-shadow:0 0 0 3px rgba(200,162,74,.22);}
  .campo.error input{border-color:var(--terracota);}
  .campo .msg{display:none;color:var(--terracota);font-size:13.5px;margin-top:5px;}
  .campo.error .msg{display:block;}
  .resumen-post{background:var(--gris-claro);border-radius:var(--r);padding:18px 20px;
    margin-bottom:26px;font-size:15.5px;}
  .resumen-post strong{display:block;font-size:18px;margin-bottom:2px;}

  /* ================= BOTONES ================= */
  .btn{display:inline-block;font-family:inherit;font-size:17px;font-weight:700;padding:15px 30px;
    border-radius:12px;border:2px solid transparent;cursor:pointer;text-align:center;
    transition:background .15s,color .15s,border-color .15s;}
  .btn-oro{background:var(--dorado);color:var(--negro);}
  .btn-oro:hover{background:var(--dorado-hondo);color:var(--blanco);}
  .btn-linea{background:transparent;color:var(--negro);border-color:var(--gris-medio);}
  .btn-linea:hover{border-color:var(--negro);}
  .btn:disabled{opacity:.55;cursor:default;}
  .acciones{display:flex;gap:12px;flex-wrap:wrap;}
  .barra-accion{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),var(--blanco) 24%);
    padding:26px 0 calc(22px + env(safe-area-inset-bottom));margin-top:10px;}
  .contador{font-size:14.5px;color:var(--gris-oscuro);margin-bottom:10px;}

  /* ================= PREGUNTAS / POSTULACIONES ================= */
  .pregunta{border-bottom:1px solid var(--gris-medio);}
  .pregunta button{width:100%;text-align:left;background:none;border:0;font-family:inherit;
    font-size:17.5px;font-weight:700;color:var(--negro);padding:19px 40px 19px 0;cursor:pointer;
    position:relative;line-height:1.35;}
  .pregunta button::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);
    font-size:24px;font-weight:700;color:var(--dorado-hondo);}
  .pregunta.abierta button::after{content:"–";}
  .pregunta div{display:none;padding:0 0 20px;font-size:16.5px;line-height:1.6;color:#3A3A3A;max-width:62ch;}
  .pregunta.abierta div{display:block;}
  .post-item{border:1px solid var(--gris-medio);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .post-item b{font-size:17px;font-weight:700;}
  .post-item small{display:block;color:var(--gris-oscuro);font-size:14px;}
  .post-cod{margin-left:auto;background:var(--negro);color:var(--dorado);font-weight:800;
    letter-spacing:.07em;font-size:15px;padding:8px 15px;border-radius:9px;}

  /* ================= FORMACIÓN ================= */
  .form-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
  .form-tab{padding:9px 20px;border-radius:20px;border:2px solid var(--gris-medio);background:none;
    font-family:inherit;font-size:15px;font-weight:600;color:var(--gris-oscuro);cursor:pointer;transition:all .18s;}
  .form-tab:hover{border-color:var(--dorado);color:var(--dorado);}
  .form-tab.activa{background:var(--negro);border-color:var(--negro);color:var(--dorado);}
  .inst-bloque{margin-bottom:36px;}
  .inst-titulo{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .inst-logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;letter-spacing:-.01em;flex-shrink:0;}
  .inst-logo.azul{background:#1A3A5C;color:#E8C87A;}
  .inst-logo.verde-osc{background:#1C3D28;color:#7DC47D;}
  .inst-logo.cafe{background:#3D2B1F;color:#E8C87A;}

/* ===================================================================

   El portal lee el espejo público que publica el artefacto administrativo:

function ico(nombre,color,tam){
  const cuerpo=(I[nombre]||I.brujula).replace(/COL/g,color||'#C8A24A');
  return '<svg width="'+(tam||24)+'" height="'+(tam||24)+'" viewBox="0 0 24 24" fill="none" aria-hidden="true">'+cuerpo+'</svg>';
}
// El ícono de cada área se deduce de su nombre, para que funcione con las áreas
// que existan en el artefacto sin tener que configurarlas una por una.
function icoDeArea(nombre){
  const n=(nombre||'').toLowerCase();
  if(/granja|avic|avíc|pollo|ave/.test(n)) return 'gallina';
  if(/planta|producc|proceso|manufact/.test(n)) return 'engranaje';
  if(/mantenim|electro|mecan/.test(n)) return 'casco';
  if(/log|transport|almac|distribu|cadena/.test(n)) return 'caja';
  if(/comercial|venta|mercade|cliente|punto/.test(n)) return 'carrito';
  if(/administ|gesti|human|financ|contab|jurid|calidad|sistema/.test(n)) return 'monitor';
  return 'personas';
}

/* ---------- Traducción de campos internos a lenguaje de la gente ---------- */
const GRUPOS = [
  { key:'formacion',           titulo:'Lo que necesitas haber estudiado', modo:'unico',  peso:'clave',
    nota:'Es el estudio mínimo con el que se entra al cargo.' },
  { key:'experiencia',         titulo:'La experiencia que se pide',       modo:'unico',  peso:'clave',
    nota:'Cuenta el tiempo que llevas haciendo trabajos parecidos.' },
  { key:'compTecnicas',        titulo:'Lo que necesitas saber hacer',     modo:'lineas', peso:'clave',
    nota:'Conocimientos y herramientas del día a día en el cargo.' },
  { key:'requerimientos',      titulo:'Condiciones del cargo',            modo:'lineas', peso:'clave',
    nota:'Cosas prácticas que el cargo exige.' },
  { key:'compBlandas',         titulo:'Cómo se trabaja en este cargo',    modo:'lineas', peso:'suma',
    nota:'Suman a tu favor, pero no cierran la puerta.' },
  { key:'competenciasComunes', titulo:'Lo que esperamos de todos',        modo:'lineas', peso:'suma',
    nota:'Las formas de trabajar que compartimos en toda la organización.' }
];

function lineas(txt){
  return (txt||'').split('\n').map(s=>s.replace(/^[-•*]\s*/,'').trim()).filter(Boolean);
}
function requisitosDe(cargo){
  const out=[];
  GRUPOS.forEach(g=>{
    const bruto=(cargo[g.key]||'').trim();
    if(!bruto) return;
    const items = g.modo==='unico' ? [bruto.replace(/\n+/g,' ')] : lineas(bruto);
    items.forEach((texto,i)=>{
      out.push({ id:g.key+':'+i, grupo:g.key, titulo:g.titulo, nota:g.nota, peso:g.peso, texto });
    });
  });
  return out;
}
function calcular(cargo){
  const reqs=requisitosDe(cargo);
  const claves=reqs.filter(r=>r.peso==='clave');
  const clavesOk=claves.filter(r=>marcados.has(r.id));
  const sumas=reqs.filter(r=>r.peso==='suma');
  const sumasOk=sumas.filter(r=>marcados.has(r.id));
  const pct=claves.length?Math.round((clavesOk.length/claves.length)*100):100;
  return { reqs, claves, clavesOk, sumas, sumasOk, pct,
    faltan:claves.filter(r=>!marcados.has(r.id)), tiene:reqs.filter(r=>marcados.has(r.id)) };
}

/* ===================================================================
   CARGA
   =================================================================== */
async function cargar(){
  if(!hayFirebase){ modoDemo=true; datos=datosDemo(); pintar(); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
    db=firebase.firestore();
    const doc=await db.collection(COL_PUBLICA).doc(ORG_CODE).get();
    datos=(doc.exists && doc.data() && doc.data().payload)
      ? JSON.parse(doc.data().payload)
      : { orgName:CONFIG.nombreOrg, areas:[] };
  }catch(e){
    modoDemo=true; datos=datosDemo();
    avisar('malo','No pudimos conectarnos para traer los cargos. Estás viendo un ejemplo. Intenta más tarde o avisa a Gestión Humana.');
  }
  pintar();
}
function avisar(tipo,texto){
  const d=document.createElement('div'); d.className='aviso '+tipo; d.textContent=texto;
  document.getElementById('avisos').appendChild(d);
}

/* ===================================================================
   NAVEGACIÓN
   =================================================================== */
const SECCIONES=[
  { id:'inicio',  et:'Inicio' },
  { id:'areas',   et:'Explora las áreas' },
  { id:'mispost',   et:'Mis postulaciones' },
  { id:'formacion', et:'Educación a tu medida' },
  { id:'faq',       et:'Preguntas frecuentes' }
];
function pintarMenu(){
  const nav=document.getElementById('menu');
  nav.innerHTML='';
  SECCIONES.forEach(s=>{
    const b=document.createElement('button');
    b.textContent=s.et;
    const activo=(s.id==='inicio'&&vista==='inicio')||
      (s.id==='areas'&&['ruta','cargo','evaluar','resultado','postular'].indexOf(vista)>=0)||
      (s.id==='mispost'&&vista==='mispost')||(s.id==='formacion'&&vista==='formacion')||(s.id==='faq'&&vista==='faq');
    if(activo) b.classList.add('activo');
    b.addEventListener('click',()=>{
      nav.classList.remove('abierto');
      document.getElementById('menuBtn').setAttribute('aria-expanded','false');
      if(s.id==='areas'){
        areaSel=null; cargoSel=null; ir('inicio');
        setTimeout(()=>{ const el=document.getElementById('areas'); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); },50);
      } else ir(s.id);
    });
    nav.appendChild(b);
  });
}
document.getElementById('menuBtn').addEventListener('click',function(){
  const nav=document.getElementById('menu');
  const ab=nav.classList.toggle('abierto');
  this.setAttribute('aria-expanded',ab?'true':'false');
});
document.getElementById('marcaBtn').addEventListener('click',()=>{ areaSel=null;cargoSel=null;ir('inicio'); });

function ir(v){ vista=v; pintar(); window.scrollTo(0,0); }

/* ===================================================================
   PINTADO
   =================================================================== */
const app=document.getElementById('app');
function esc(s){ return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function volver(texto,fn){
  const b=document.createElement('button'); b.className='volver'; b.textContent='‹ '+texto;
  b.addEventListener('click',fn); return b;
}
// Crea la estructura sección > contenido > ficha y devuelve el nodo donde escribir.
function lienzo(estrecho){
  const sec=document.createElement('section'); sec.className='seccion';
  const cont=document.createElement('div'); cont.className='contenido';
  sec.appendChild(cont); app.appendChild(sec);
  if(!estrecho) return cont;
  const f=document.createElement('div'); f.className='ficha'; cont.appendChild(f); return f;
}

function pintar(){
  pintarMenu();
  app.innerHTML='';
  if(!datos){
    const d=document.createElement('div'); d.className='centro';
    d.innerHTML='<div class="girador"></div><p>Buscando los caminos disponibles…</p>';
    app.appendChild(d); return;
  }
  if(vista==='inicio') vistaInicio();
  else if(vista==='ruta') vistaRuta();
  else if(vista==='cargo') vistaCargo();
  else if(vista==='evaluar') vistaEvaluar();
  else if(vista==='resultado') vistaResultado();
  else if(vista==='postular') vistaPostular();
  else if(vista==='listo') vistaListo();
  else if(vista==='mispost') vistaMisPostulaciones();
  else if(vista==='formacion') vistaFormacion();
  else if(vista==='faq') vistaFaq();
}

/* ---------- Portada ---------- */
function vistaInicio(){
  const port=document.createElement('div');
  port.className='portada';
  port.innerHTML=

function pintarAreas(zona){
  zona.innerHTML='';
  const q=busqueda.trim().toLowerCase();

  if(q){
    // Con búsqueda mostramos cargos de todas las áreas, no solo nombres de área.
    const hits=[];
    datos.areas.forEach(a=>a.cargos.forEach(c=>{
      const texto=(c.nombre+' '+(c.descripcion||'')+' '+a.nombre).toLowerCase();
      if(texto.indexOf(q)>=0) hits.push({a:a,c:c});
    }));
    if(!hits.length){
      zona.innerHTML='<div class="vacio-msg">No encontramos nada con “'+esc(busqueda)+'”.<br>Prueba con otra palabra, o borra la búsqueda para ver todas las áreas.</div>';
      return;
    }
    const ol=document.createElement('ol'); ol.className='ruta';
    hits.forEach(h=>ol.appendChild(peldano(h.c,h.a,true)));
    zona.appendChild(ol);
    return;
  }

  const rej=document.createElement('div'); rej.className='rejilla-areas';
  datos.areas.forEach(area=>{
    const foto=IMAGENES.areas[area.nombre];
    const n=area.cargos.length;
    const b=document.createElement('button');
    b.className='area';
    b.innerHTML=
      '<div class="area-foto '+(foto?'':'sin-foto')+'" '+(foto?'style="background-image:url(\''+foto+'\')"':'')+'>'+
        (foto?'':ico(icoDeArea(area.nombre),'rgba(31,31,31,.22)',56))+
        '<span class="area-ico">'+ico(icoDeArea(area.nombre),'#1F1F1F',20)+'</span>'+
      '</div>'+
      '<div class="area-pie"><div>'+
        '<div class="area-nom">'+esc(area.nombre)+'</div>'+
        '<div class="area-cuenta">'+n+' '+(n===1?'cargo para conocer':'cargos para conocer')+'</div>'+
      '</div>'+ico('flecha','#666666',20)+'</div>';
    b.addEventListener('click',()=>{ areaSel=area; ir('ruta'); });
    rej.appendChild(b);
  });
  zona.appendChild(rej);
}

function peldano(c,area,conArea){
  const li=document.createElement('li'); li.className='peldano';
  const teaser=(c.descripcion||'').trim();
  const corto=teaser?(teaser.length>135?teaser.slice(0,132).trim()+'…':teaser):'Entra para ver qué se necesita para este cargo.';
  li.innerHTML='<div class="marca-nivel">'+(c.nivel!=null?c.nivel:'·')+'</div>';
  const b=document.createElement('button');
  b.className='peldano-btn';
  b.innerHTML='<div class="peldano-nom">'+esc(c.nombre)+'</div>'+
    (conArea?'<div class="peldano-area">'+esc(area.nombre)+'</div>':'')+
    '<div class="peldano-txt">'+esc(corto)+'</div>'+
    '<div class="peldano-ver">Ver qué necesitas</div>';
  b.addEventListener('click',()=>{ areaSel=area; cargoSel=c; marcados=new Set(); resultado=null; ir('cargo'); });

}

function vistaEvaluar(){
  if(!cargoSel) return ir('inicio');
  const reqs=requisitosDe(cargoSel);
  const f=lienzo(true);
  f.appendChild(volver('Volver al cargo',()=>ir('cargo')));

  const cab=document.createElement('div');
  cab.innerHTML='<h2 class="titulo-pag">Mírate frente a '+esc(cargoSel.nombre)+'</h2>'+

  let actual='';
  reqs.forEach(r=>{
    if(r.titulo!==actual){
      actual=r.titulo;
      const h=document.createElement('div'); h.className='grupo-eval'; h.textContent=r.titulo;
      f.appendChild(h);

function valorDe(id){ const el=document.getElementById('f-'+id); return el?el.value.trim():''; }

function guardarLocal(reg){
  try{
    const prev=JSON.parse(localStorage.getItem(CLAVE_MIS_POST)||'[]');
    prev.unshift({ codigo:reg.codigo, cargo:reg.cargoNombre, area:reg.areaNombre,
      pct:reg.ajustePct, fecha:new Date().toISOString() });
    localStorage.setItem(CLAVE_MIS_POST, JSON.stringify(prev.slice(0,30)));
  }catch(e){}
}

async function enviar(){
  if(enviando) return;
  let ok=true;
  CAMPOS.forEach(c=>{
    const cont=document.getElementById('campo-'+c.id);
    const malo=c.req && !valorDe(c.id);
    cont.classList.toggle('error',malo);
    if(malo && ok) document.getElementById('f-'+c.id).focus();
    if(malo) ok=false;
  });
  if(!ok) return;

  // Validar autorización de datos
  const autChk=document.getElementById('f-autorizo');
  const autErr=document.getElementById('autError');
  if(autChk && !autChk.checked){
    if(autErr) autErr.style.display='block';
    autChk.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  if(autErr) autErr.style.display='none';

  enviando=true; errorEnvio='';
  const btn=document.getElementById('btnEnviar');
  btn.disabled=true; btn.textContent='Enviando…';

  const r=resultado||calcular(cargoSel);
  codigoRef=(CONFIG.nombreOrg||'PC').replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()+'-'+
    Math.random().toString(36).slice(2,6).toUpperCase();

  const registro={
    codigo:codigoRef, orgCode:ORG_CODE||'demo',
    areaId:areaSel.id, areaNombre:areaSel.nombre,
    cargoId:cargoSel.id, cargoNombre:cargoSel.nombre, cargoNivel:(cargoSel.nivel!=null?cargoSel.nivel:null),
    nombre:valorDe('nombre'), documento:valorDe('documento'), celular:valorDe('celular'),
    correo:valorDe('correo'), cargoActual:valorDe('cargoActual'), sede:valorDe('sede'),
    motivacion:valorDe('motivo'), ajustePct:r.pct,
    requisitosClaveTotal:r.claves.length, requisitosClaveCumplidos:r.clavesOk.length,
    cumple:r.tiene.map(x=>x.texto), leFalta:r.faltan.map(x=>x.texto), estado:'nueva'
  };

  if(modoDemo||!db){ guardarLocal(registro); enviando=false; ir('listo'); return; }
  try{
    registro.creadoEn=firebase.firestore.FieldValue.serverTimestamp();
    await db.collection(COL_POSTULACIONES).add(registro);
    guardarLocal(registro); enviando=false; ir('listo');
  }catch(e){
    enviando=false;
    errorEnvio='No pudimos enviar tu postulación. Revisa que tengas señal e inténtalo otra vez.';
    pintar();
  }
}

    b.addEventListener('click',()=>{ areaSel=null; ir('inicio'); });
    f.appendChild(b);
    return;
  }
  lista.forEach(p=>{
    const d=document.createElement('div'); d.className='post-item';
    const fe=new Date(p.fecha);
    const fecha=isNaN(fe.getTime())?'':fe.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
    d.innerHTML='<div><b>'+esc(p.cargo)+'</b><small>'+esc(p.area)+' · enviada el '+fecha+'</small></div>'+
      '<span class="post-cod">'+esc(p.codigo)+'</span>';
    f.appendChild(d);
  });
}

function vistaFormacion(){
  const f=lienzo(false);
  // Encabezado
  const cab=document.createElement('div'); cab.className='seccion-cab';
  cab.innerHTML='<div><h2 class="titulo-pag">Educación a tu medida</h2>'+
    '<p class="lead-pag">Convenios y programas disponibles para colaboradores de '+esc(CONFIG.nombreOrg)+'. Selecciona la categoría que te interesa.</p></div>';
  f.appendChild(cab);

  // Estado de la pestaña activa
  let catActiva=PORTAFOLIO[0].id;

  // Contenedor de pestañas
  const tabsEl=document.createElement('div'); tabsEl.className='form-tabs';
  f.appendChild(tabsEl);

  // Zona de contenido
  const zonaEl=document.createElement('div');
  f.appendChild(zonaEl);

  function renderCat(){
    // Tabs
    tabsEl.innerHTML='';
    PORTAFOLIO.forEach(cat=>{
      const btn=document.createElement('button');
      btn.className='form-tab'+(cat.id===catActiva?' activa':'');
      btn.innerHTML=cat.label+'<small style="display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:1px;">'+cat.desc+'</small>';
      btn.addEventListener('click',()=>{ catActiva=cat.id; renderCat(); });
      tabsEl.appendChild(btn);
    });

    // Contenido de la categoría activa
    zonaEl.innerHTML='';
    const cat=PORTAFOLIO.find(c=>c.id===catActiva);
    if(!cat) return;

    const tit=document.createElement('p'); tit.className='form-cat-sub';
    tit.textContent=cat.programas_total||cat.desc;
    zonaEl.appendChild(tit);

    cat.instituciones.forEach(inst=>{
      const bloque=document.createElement('div'); bloque.className='inst-bloque';

      const encInst=document.createElement('div'); encInst.className='inst-titulo';
      const logo=document.createElement('div');
      logo.className='inst-logo '+(inst.color||'azul');
      logo.textContent=inst.sigla;
      encInst.appendChild(logo);
      const textoInst=document.createElement('div');
      textoInst.innerHTML='<p class="inst-nombre">'+esc(inst.nombre)+'</p>';
      encInst.appendChild(textoInst);
      bloque.appendChild(encInst);

      const rejilla=document.createElement('div'); rejilla.className='prog-rejilla';
      inst.programas.forEach(prog=>{
        const card=document.createElement('div'); card.className='prog-card';
        const esGratis=prog.valor==='Gratis';
        const modalidadBadge=prog.modalidad.toLowerCase().includes('presencial')?'presencial':'';
        card.innerHTML=
          '<h4>'+esc(prog.nombre)+'</h4>'+
          '<div class="prog-meta">'+
            '<span class="prog-badge">'+esc(prog.duracion)+'</span>'+
            '<span class="prog-badge '+(modalidadBadge)+'">'+esc(prog.modalidad.split('·')[0].trim())+'</span>'+
          '</div>'+
          '<p class="prog-valor">'+esc(prog.valor)+(esGratis?'':' <span>por semestre/curso</span>')+'</p>'+
          (prog.aviso?'<p class="prog-link-aviso">📋 '+esc(prog.aviso)+'</p>':
            (prog.link?'<a class="prog-link" href="'+esc(prog.link)+'" target="_blank" rel="noopener">Ver programa ↗</a>':''));
        rejilla.appendChild(card);
      });
      bloque.appendChild(rejilla);
      zonaEl.appendChild(bloque);
    });
  }

  renderCat();
}

function vistaFaq(){
  const f=lienzo(true);
  f.innerHTML='<h2 class="titulo-pag">Preguntas frecuentes</h2>'+
    '<p class="lead-pag">Lo que más nos preguntan sobre el plan de carrera.</p>';
  PREGUNTAS.forEach(q=>{
    const d=document.createElement('div'); d.className='pregunta';
    d.innerHTML='<button aria-expanded="false">'+esc(q.p)+'</button><div>'+esc(q.r)+'</div>';
    d.querySelector('button').addEventListener('click',function(){
      const ab=d.classList.toggle('abierta');
      this.setAttribute('aria-expanded',ab?'true':'false');
    });
    f.appendChild(d);
  });
}
